openapi: 3.0.3

info:
  title: Pricing Service API
  description: API for retrieving the applicable product price.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api

paths:

  /v1/prices:
    get:
      summary: Get applicable product price
      description: >
        Returns the price applicable to a product for a given brand
        and application date.
      operationId: getApplicablePrice
      tags:
        - Pricing
      parameters:

        - name: applicationDate
          in: query
          description: Date and time for which the applicable price is requested.
          required: true
          schema:
            type: string
            format: date-time-local
          example: "2020-06-14T16:00:00"

        - name: productId
          in: query
          description: Product identifier.
          required: true
          schema:
            type: integer
            format: int32
          example: 35455

        - name: brandId
          in: query
          description: Brand or chain identifier.
          required: true
          schema:
            type: integer
            format: int32
          example: 1

      responses:

        '200':
          description: Applicable price found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'

        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: No applicable price was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Inconsistent price configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  schemas:

    PriceResponse:
      type: object
      required:
        - productId
        - brandId
        - priceList
        - startDate
        - endDate
        - price
      properties:

        productId:
          type: integer
          format: int32
          description: Product identifier.
          example: 35455

        brandId:
          type: integer
          format: int32
          description: Brand or chain identifier.
          example: 1

        priceList:
          type: integer
          format: int32
          description: Applicable price list identifier.
          example: 2

        startDate:
          type: string
          format: date-time-local
          description: Start date and time of the applicable price.
          example: "2020-06-14T15:00:00"

        endDate:
          type: string
          format: date-time-local
          description: End date and time of the applicable price.
          example: "2020-06-14T18:30:00"

        price:
          type: number
          description: Final price to apply.
          example: 25.45

    ErrorResponse:
      type: object
      required:
        - status
        - errorType
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          example: 404
        errorType:
          type: string
          example: Not Found
        code:
          type: string
          description: Application error code.
          example: PRICE-001
        message:
          type: string
          description: Error message.
          example: No applicable price was found.