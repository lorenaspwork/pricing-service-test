spring:
  datasource:
    url: jdbc:h2:mem:pricingdb-test
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/test-data.sql

logging:
  level:
    com.lsp.pricingservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE #Muestra los valores de los parámetros de las queries
